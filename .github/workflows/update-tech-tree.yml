name: Update Tech Tree

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout magix-fix
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout tree-builder
        uses: actions/checkout@v4
        with:
          repository: painekillers/tree-builder
          path: tree-builder

      - name: Copy tree-builder files
        run: |
          rsync -av \
            --exclude='nodes.js' \
            --exclude='themes/' \
            tree-builder/ tech-tree/

          rsync -av tree-builder/themes/ tech-tree/themes/

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tech-tree
          git diff --cached --quiet || git commit -m "Update tech-tree from tree-builder"

      - name: Push changes
        run: |
          git push origin HEAD:${{ github.ref_name }}
